name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}
      - name: Test
        run: task test
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.txt
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}
      - name: Build
        run: task build

  # Users often run a newer Go than go.mod asks for; failures of go/types or
  # golang.org/x/tools with the newest release show up here before a release.
  test-latest-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Test
        run: go test -race ./...

  # Build the binary the way the release does and run it on every released
  # platform with the newest Go on PATH, as users do.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build like the release
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/ripples$(go env GOEXE)" .
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Analyze with the newest Go on PATH
        run: |
          ripples="$RUNNER_TEMP/ripples$(go env GOEXE)"
          "$ripples" --version
          "$ripples" -repo . -old HEAD~1 -new HEAD

          # Export data of math/rand/v2 from Go 1.27 on has generic methods,
          # which only a matching go/types can read.
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture/lib"
          git -C "$fixture" init -q
          git -C "$fixture" config user.name ci
          git -C "$fixture" config user.email ci@example.com
          printf 'module example.com/fixture\n\ngo 1.26\n' > "$fixture/go.mod"
          printf 'package lib\n\nimport "math/rand/v2"\n\nfunc Value() int { return rand.IntN(3) }\n' > "$fixture/lib/lib.go"
          git -C "$fixture" add -A
          git -C "$fixture" commit -qm old
          printf 'package lib\n\nimport "math/rand/v2"\n\nfunc Value() int { return rand.IntN(3) + 1 }\n' > "$fixture/lib/lib.go"
          git -C "$fixture" commit -qam new
          test "$("$ripples" -repo "$fixture" -old HEAD~1 -new HEAD)" = lib.lib
